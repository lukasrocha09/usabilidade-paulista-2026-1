<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Div onde o React será renderizado -->
    <div id="root"></div>

    <!-- Bibliotecas do React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js">  

    </script>

<!-- React DOM  faz a ponte entre o react e o DOM do navegador-->
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">
    </script>
<!-- Babel para transpilar JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>    
    <script src="https://unpkg.com/styled-components/dist/styled-components.min.js"></script>
    <script type="text/babel">

        function ListaComDescricao(){

                const item = [
            {id: 1, titulo: 'Primeiro', descricao: 'Descrição 1'},
            {id: 2, titulo: 'Segundo', descricao: 'Descrição 2'},
            {id: 3, titulo: 'Terceiro', descricao: 'Descrição 3'},
        

        ]
        

        return(
                <d1>
                    {item.map(item => (
                        <React.fragment key={item.id}>
                            <dt>{item.titulo}</dt>
                            <dd>{item.descricao}</dd>
                        </React.fragment>
                    ))}
                </d1>
            );
            
            }



        //const estilo ={color:'green', backgroundColor:'lightgray', padding:'10px'}   
        // Componente de exemplo
        //    const Titulo = styled.h1`
        //    color: purple;
        //    text-align: center;
        //`;
        
       

        ReactDOM.createRoot(document.getElementById('root')).render
        (<ListaComDescricao />);


</script>
    
</body>
</html>
